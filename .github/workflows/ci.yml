name: CI

on:
  push:
    branches: [main]
  pull_request:

# Art arda push'larda eski koşuyu iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ponytail: integration/e2e canlı Supabase ister, CI'da yalnız unit
      - run: npm run test:unit
